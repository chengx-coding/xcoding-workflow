<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>probe</title></head>
<body>
<pre id="out">pending</pre>
<script>
(function () {
  var result = {};
  try {
    localStorage.setItem("probe-key", "probe-value");
    result.localStorage = localStorage.getItem("probe-key") === "probe-value" ? "writable" : "wrong-read";
    localStorage.removeItem("probe-key");
  } catch (error) {
    result.localStorage = "error:" + (error && error.name);
  }
  try {
    var canvas = document.createElement("canvas");
    canvas.width = 8; canvas.height = 8;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#123456"; ctx.fillRect(0, 0, 8, 8);
    result.canvas = ctx.getImageData(2, 2, 1, 1).data.join(",") === "18,52,86,255" ? "ok" : "bad-pixels";
  } catch (error) {
    result.canvas = "error:" + (error && error.name);
  }
  try {
    var audio = window.AudioContext || window.webkitAudioContext;
    result.audioContext = audio ? "available" : "missing";
  } catch (error) {
    result.audioContext = "error:" + (error && error.name);
  }
  result.location = location.href;
  result.viewport = window.innerWidth + "x" + window.innerHeight;
  result.devicePixelRatio = window.devicePixelRatio;
  document.getElementById("out").textContent = JSON.stringify(result);
})();
</script>
</body>
</html>
