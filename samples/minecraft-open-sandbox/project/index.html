<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emberdeep — a small 2D sandbox</title>
  <meta name="description" content="Emberdeep is a playable, offline 2D sandbox inspired by Minecraft. Mine, craft, build and light the deep.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game" width="1152" height="648" aria-label="Emberdeep sandbox world"></canvas>
    <div id="hud" aria-live="polite"></div>
    <div id="hotbar" role="toolbar" aria-label="Block and tool palette"></div>
    <div id="hint" role="status"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="overlay" role="dialog" aria-modal="true" aria-label="Game menu"></div>
  </div>
  <div id="status" data-state="booting" title="Page status"></div>
  <script src="js/config.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/blocks.js"></script>
  <script src="js/world.js"></script>
  <script src="js/light.js"></script>
  <script src="js/player.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/crafting.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/mobs.js"></script>
  <script src="js/save.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
