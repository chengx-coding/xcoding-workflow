<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wildgrove — a tiny 2D sandbox</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <section id="stage" aria-label="Sandbox game">
      <canvas id="game" width="960" height="540" aria-label="Sandbox world"></canvas>

      <header id="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-text">
            <strong>Wildgrove</strong>
            <small>a tiny 2D sandbox</small>
          </span>
        </div>

        <div class="stats" aria-live="polite">
          <span class="stat">
            <span class="stat-label">Position</span>
            <span id="coords-value" class="stat-value">12, 41</span>
          </span>
          <span class="stat">
            <span class="stat-label">Time</span>
            <span class="stat-value"><span id="clock-text">07:40</span> <em id="phase-value">day</em></span>
          </span>
          <span class="stat">
            <span class="stat-label">Seed</span>
            <span id="seed-value" class="stat-value">1337</span>
          </span>
        </div>

        <div class="actions">
          <button id="pause-button" class="chip" type="button" aria-pressed="false" title="Pause or resume (P)">Pause</button>
          <button id="mute-button" class="chip" type="button" aria-pressed="false" title="Toggle sound (M)">Sound on</button>
          <form id="seed-form" class="seed-form" autocomplete="off">
            <label class="sr-only" for="seed-input">World seed</label>
            <input id="seed-input" class="seed-input" type="text" inputmode="numeric" pattern="[0-9-]*" maxlength="10" value="1337" aria-label="World seed" title="Enter a whole-number seed and press Enter">
            <button class="chip chip-primary" type="submit" title="Generate a world from this seed">New world</button>
          </form>
        </div>
      </header>

      <aside id="minimap-panel" class="minimap-panel" aria-label="World map">
        <div class="minimap-head"><span>Map</span><span id="minimap-seed">1337</span></div>
        <canvas id="minimap" width="180" height="64" aria-label="Minimap of the sandbox world"></canvas>
      </aside>

      <div id="hud" aria-live="polite">
        <span class="hud-dot" aria-hidden="true"></span>
        <span id="target-value">Looking at the sky</span>
      </div>

      <div id="hotbar" role="toolbar" aria-label="Block palette"></div>

      <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

      <div id="pause-overlay" class="pause-overlay" hidden>
        <div class="pause-card">
          <p class="eyebrow">Simulation paused</p>
          <h1>Paused</h1>
          <p class="pause-copy">The world is holding still. Your blocks and position are kept.</p>
          <div class="pause-actions">
            <button id="resume-button" class="chip chip-primary" type="button">Resume</button>
            <span class="pause-hint">or press <kbd>P</kbd></span>
          </div>
        </div>
      </div>
    </section>

    <footer id="hintline">
      <span><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> move</span>
      <span><kbd>Space</kbd> jump</span>
      <span><kbd>Left click</kbd> mine</span>
      <span><kbd>Right click</kbd> build</span>
      <span><kbd>1</kbd>–<kbd>9</kbd> or wheel select</span>
      <span><kbd>P</kbd> pause</span>
      <span><kbd>M</kbd> mute</span>
    </footer>

    <div id="status" data-state="booting" title="Page status"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/world.js"></script>
  <script src="js/player.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/interaction.js"></script>
  <script src="js/persistence.js"></script>
  <script src="js/timecycle.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/mining.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
