[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "xcoding-workflow"
version = "0.1.0"
description = "Portable xcoding workflow runtime, Viewer, daemon, and Skill Bundle."
requires-python = ">=3.12"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.scripts]
xcoding = "xcoding.cli:main"

[tool.hatch.build]
reproducible = true

[tool.hatch.build.targets.wheel]
packages = ["src/xcoding"]

[tool.hatch.build.hooks.custom]
path = "build_support/hatch_build.py"
