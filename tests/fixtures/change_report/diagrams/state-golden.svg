<svg class="report-diagram-svg" id="diagram-2" width="268" height="366" viewBox="0 0 268 366" role="img" font-size="12"><title>Report lifecycle states</title><desc>A report moves from generated to validated, and either stays current or becomes stale and is refreshed.</desc><defs><marker id="diagram-2-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" /></marker></defs><path class="diagram-edge" d="M 134 70 L 134 160" marker-end="url(#diagram-2-arrow)" fill="none" /><text class="diagram-edge-label" x="134" y="115" font-size="12" text-anchor="middle"><title>checks pass</title>checks pass</text><path class="diagram-edge" d="M 134 342 L 134 387 L 134 387 L 134 24" marker-end="url(#diagram-2-arrow)" fill="none" /><text class="diagram-edge-label" x="134" y="183" font-size="12" text-anchor="middle"><title>refresh round</title>refresh round</text><path class="diagram-edge" d="M 134 206 L 134 296" marker-end="url(#diagram-2-arrow)" fill="none" /><text class="diagram-edge-label" x="134" y="251" font-size="12" text-anchor="middle"><title>code changes</title>code changes</text><rect class="diagram-node" x="24" y="24" width="220" height="46" rx="4" /><text class="diagram-node-label" x="134" y="52" font-size="12" text-anchor="middle"><title>Generated</title>Generated</text><rect class="diagram-node" x="24" y="160" width="220" height="46" rx="4" /><text class="diagram-node-label" x="134" y="188" font-size="12" text-anchor="middle"><title>Validated</title>Validated</text><rect class="diagram-node" x="24" y="296" width="220" height="46" rx="4" /><text class="diagram-node-label" x="134" y="324" font-size="12" text-anchor="middle"><title>Stale</title>Stale</text></svg>
